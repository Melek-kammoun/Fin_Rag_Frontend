<div class="upload-container">
  <div class="upload-card">
    <div class="upload-header">
      <span class="upload-icon"><i class="pi pi-file-pdf"></i></span>
      <div>
        <h2>{{ title }}</h2>
        <p class="upload-subtitle">{{ subtitle }}</p>
      </div>
    </div>

    <div class="upload-dropzone" [class.has-file]="selectedFile">
      <div class="dropzone-illustration">
        <i class="pi pi-cloud-upload"></i>
      </div>
      <p class="dropzone-title">Glissez votre fichier ici ou parcourez</p>
      <p class="dropzone-hint">Format accepté : PDF — 20 Mo maximum</p>

      <p-fileUpload
        mode="basic"
        accept=".pdf"
        [auto]="false"
        chooseLabel="Choisir un PDF"
        chooseIcon="pi pi-upload"
        (onSelect)="onFileSelect($event)">
      </p-fileUpload>

      <div class="selected-file" *ngIf="selectedFile">
        <i class="pi pi-file-pdf"></i>
        <div class="selected-file-info">
          <strong>{{ selectedFile.name }}</strong>
          <span>{{ formatFileSize(selectedFile.size) }}</span>
        </div>
        <i class="pi pi-check-circle selected-file-check"></i>
      </div>
    </div>

    <p-button
      [label]="loading ? 'Ingestion en cours…' : 'Lancer l\'ingestion'"
      icon="pi pi-send"
      [loading]="loading"
      [disabled]="!selectedFile || loading"
      (onClick)="upload()"
      styleClass="upload-btn">
    </p-button>

    <div class="upload-pipeline" *ngIf="loading || (response && response.success)">
      <div class="pipeline-step" *ngFor="let step of steps" [class]="stepState(step.status)">
        <span class="step-dot"><i class="pi" [ngClass]="step.icon"></i></span>
        <span class="step-label">{{ step.label }}</span>
      </div>
    </div>

    <div class="upload-status" *ngIf="loading">
      <div class="upload-status-text">
        <strong>Ingestion en cours</strong>
        <span>{{ statusMessage }}</span>
      </div>
      <p-progressBar [value]="progress" [showValue]="false"></p-progressBar>
    </div>

    <p-message
      *ngIf="response?.success"
      severity="success"
      text="Ingestion réussie en {{ response!.durationMs }} ms — {{ response!.chunkCount }} chunk(s) généré(s)">
    </p-message>

    <p-message
      *ngIf="response && !response.success"
      severity="error"
      [text]="response.error">
    </p-message>

    <p-message
      *ngIf="errorMessage"
      severity="error"
      [text]="errorMessage">
    </p-message>
  </div>
</div>
